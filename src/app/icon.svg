<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 72">
  <defs>
    <filter id="segGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Container -->
  <rect x="0.75" y="0.75" width="54.5" height="70.5" rx="7" fill="#060a12" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Top segment (ON) -->
  <rect x="16" y="8" width="24" height="5" rx="2.5" fill="#38BDF8" filter="url(#segGlow)"/>
  <!-- Upper-left vertical (ON) -->
  <rect x="7" y="15" width="5" height="16" rx="2.5" fill="#38BDF8" filter="url(#segGlow)"/>
  <!-- Upper-right vertical (ON) -->
  <rect x="44" y="15" width="5" height="16" rx="2.5" fill="#38BDF8" filter="url(#segGlow)"/>
  <!-- Middle segment (OFF — dim ghost) -->
  <rect x="16" y="33.5" width="24" height="5" rx="2.5" fill="#38BDF8" opacity="0.2"/>
  <!-- Lower-left vertical (ON) -->
  <rect x="7" y="41" width="5" height="16" rx="2.5" fill="#38BDF8" filter="url(#segGlow)"/>
  <!-- Lower-right vertical (ON) -->
  <rect x="44" y="41" width="5" height="16" rx="2.5" fill="#38BDF8" filter="url(#segGlow)"/>
  <!-- Bottom segment (ON) -->
  <rect x="16" y="59" width="24" height="5" rx="2.5" fill="#38BDF8" filter="url(#segGlow)"/>

  <!-- 2 small diagonal segments for the slash -->
  <path d="M 18 56 L 25 42" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#segGlow)" opacity="0.9" />
  <path d="M 31 30 L 38 16" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#segGlow)" opacity="0.9" />
</svg>
