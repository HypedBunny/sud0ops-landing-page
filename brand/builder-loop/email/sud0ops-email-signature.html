<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <title>Sud0ops Email Signature</title>
  <style>
    :root { color-scheme: light only; }
    [data-ogsc], [data-ogsb] { background-color: inherit !important; color: inherit !important; }
  </style>
</head>
<body style="margin:0;padding:20px;font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;color-scheme:light only;-webkit-text-size-adjust:none;">

  <!--
  =====================================================================
    Sud0ops: Email Signature
    Alex-Jay Beukes · alex@sud0ops.com · +27 69 984 5033

    The logo is the official Builder Loop wordmark (brand/builder-loop), served from
    https://sud0ops.com/brand/sud0ops-email-logo.png so it works for every recipient. Its letters
    are light, so it sits on the dark slate panel. If images are blocked, the alt text reads "Sud0ops".
  =====================================================================
  -->

  <table cellpadding="0" cellspacing="0" border="0" role="presentation"
    style="max-width:480px;width:480px;font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;">
    <tr>
      <td>

        <table cellpadding="0" cellspacing="0" border="0" role="presentation"
          style="width:100%;background:#0F172A;border:1px solid #273449;border-top:2px solid #38BDF8;">

          <!-- Content -->
          <tr>
            <td style="padding:20px 24px;">
              <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="width:100%;">
                <tr>

                  <!-- Logo: >Sud0ops_ -->
                  <td style="vertical-align:middle;width:1px;white-space:nowrap;padding-right:16px;">
                    <a href="https://sud0ops.com" style="text-decoration:none;"><img src="https://sud0ops.com/brand/sud0ops-email-logo.png" width="150" height="32" alt="Sud0ops" style="display:block;border:0;width:150px;height:32px;font-family:'JetBrains Mono',Consolas,Menlo,monospace;font-size:18px;font-weight:700;color:#F8FAFC;" /></a>
                  </td>

                  <!-- Divider -->
                  <td style="width:1px;padding:0 16px 0 0;">
                    <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="width:1px;height:40px;">
                      <tr><td style="width:1px;background:#273449;font-size:0;line-height:0;">&nbsp;</td></tr>
                    </table>
                  </td>

                  <!-- Name + contact -->
                  <td style="vertical-align:middle;">
                    <span style="font-family:'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#F8FAFC;letter-spacing:-0.3px;display:block;line-height:1.3;">Alex-Jay Beukes</span>
                    <span style="font-family:'JetBrains Mono',Consolas,Menlo,'Courier New',monospace;font-size:10px;font-weight:600;color:#38BDF8;letter-spacing:1px;text-transform:uppercase;display:block;line-height:1;padding:4px 0 8px;">Founder</span>
                    <span style="font-size:11px;color:#94A3B8;display:block;line-height:1.4;">
                      <a href="mailto:alex@sud0ops.com" style="color:#94A3B8;text-decoration:none;">alex@sud0ops.com</a>
                      <span style="color:#475569;margin:0 4px;">&middot;</span>
                      <span>+27 69 984 5033</span>
                      <br />
                      <a href="https://sud0ops.com" style="color:#38BDF8;text-decoration:none;font-weight:600;">sud0ops.com</a>
                      <br />
                      <a href="https://www.linkedin.com/in/alex-jay-beukes/" style="color:#38BDF8;text-decoration:none;font-weight:600;">linkedin.com/in/alex-jay-beukes</a>
                    </span>
                  </td>

                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="border-top:1px solid #273449;padding:10px 24px;">
              <span style="font-size:10px;color:#94A3B8;display:block;line-height:1.5;">We don&rsquo;t just advise; we build the pipelines alongside you.</span>
              <span style="font-family:'JetBrains Mono',Consolas,Menlo,'Courier New',monospace;font-size:9px;color:#FFB800;display:block;line-height:1.5;">[status: systems optimised]</span>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
